<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Deflaters // League Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a13; --surface: #111827; --card: #151f32; --border: #24324d;
      --text: #f1f5f9; --muted: #94a3b8; --dim: #475569; --accent: #38bdf8;
      --green: #10b981; --green-bg: rgba(16, 185, 129, 0.12);
      --red: #f43f5e; --red-bg: rgba(244, 63, 94, 0.12);
      --amber: #f59e0b; --amber-bg: rgba(245, 158, 11, 0.12);
      --gold: #fbbf24; --gold-bg: rgba(251, 191, 36, 0.15);
      --th-bg: #0d1424;
    }
    body.light-mode {
      --bg: #f8fafc; --surface: #ffffff; --card: #ffffff; --border: #e2e8f0;
      --text: #0f172a; --muted: #64748b; --dim: #94a3b8; --accent: #0284c7;
      --green: #059669; --green-bg: rgba(5, 150, 105, 0.12);
      --red: #e11d48; --red-bg: rgba(225, 29, 72, 0.12);
      --gold: #b45309; --gold-bg: rgba(245, 158, 11, 0.15);
      --th-bg: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: var(--bg); color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; line-height: 1.5;
    }
    body { padding: 16px 12px; }
    .wrapper { max-width: 1080px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border); border-radius: 18px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .header h1 { font-size: 22px; font-weight: 800; color: #fff; }
    .header .subtitle { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }
    .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .selector-group {
      display: inline-flex; align-items: center; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border);
      padding: 4px 8px; border-radius: 12px; gap: 8px;
    }
    .selector-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); }
    .dropdown-select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; outline: none;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
    }

    .tab-bar { display: flex; flex-wrap: wrap; gap: 6px; background: var(--surface); padding: 6px; border-radius: 14px; border: 1px solid var(--border); }
    .tab-btn {
      flex: 1 1 auto; min-width: 120px; padding: 10px 14px; background: transparent; border: 1px solid transparent;
      border-radius: 10px; color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--card); color: var(--text); border-color: var(--border); }

    .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; overflow: hidden; }
    .responsive-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .responsive-table th { background: var(--th-bg); color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .responsive-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .team-cell { font-weight: 800; color: var(--text); }
    .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .badge-win { background: var(--green-bg); color: var(--green); }
    .badge-loss { background: var(--red-bg); color: var(--red); }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div>
      <div class="subtitle">The Deflaters Analytics Lab</div>
      <h1 id="headerTitle">LOADING...</h1>
    </div>
    <div class="header-controls">
      <div class="selector-group">
        <span class="selector-label">Season:</span>
        <select id="seasonSelect" class="dropdown-select" onchange="onSeasonChange(this.value)"></select>
      </div>
      <div class="selector-group">
        <span class="selector-label">Week:</span>
        <select id="weekSelect" class="dropdown-select" onchange="onWeekChange(this.value)"></select>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()">☀️ Light Mode</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabBtnWeek">📅 Week Summary</button>
  </div>

  <div id="view-week" class="table-container">
    <table class="responsive-table">
      <thead>
        <tr>
          <th>Team</th>
          <th>Result</th>
          <th>Score</th>
          <th>Opponent</th>
          <th>All-Play</th>
          <th>Coaching Eff</th>
        </tr>
      </thead>
      <tbody id="weekTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  let seasonsData = {};
  let currentYear = '';
  let currentWeek = '';

  async function init() {
    try {
      const response = await fetch('./seasons_data.json');
      seasonsData = await response.json();
      
      const years = Object.keys(seasonsData).sort((a, b) => b - a);
      if (years.length > 0) {
        currentYear = years[0];
        setupSeasonDropdown(years);
      }
    } catch (err) {
      console.error('Failed to load seasons data:', err);
      document.getElementById('headerTitle').innerText = 'ERROR LOADING DATA';
    }
  }

  function setupSeasonDropdown(years) {
    const seasonSel = document.getElementById('seasonSelect');
    seasonSel.innerHTML = '';
    years.forEach(yr => {
      const opt = document.createElement('option');
      opt.value = yr;
      opt.textContent = yr + ' Season';
      if (yr === currentYear) opt.selected = true;
      seasonSel.appendChild(opt);
    });
    populateWeeks(currentYear);
  }

  function populateWeeks(yr, targetWk) {
    const weekSel = document.getElementById('weekSelect');
    weekSel.innerHTML = '';
    const weeksObj = seasonsData[yr] || {};
    const weeks = Object.keys(weeksObj).map(Number).sort((a, b) => b - a);
    
    if (weeks.length === 0) weeks.push(1);
    currentWeek = targetWk ? targetWk.toString() : weeks[0].toString();

    weeks.forEach(w => {
      const opt = document.createElement('option');
      opt.value = w;
      opt.textContent = 'Week ' + w;
      if (w.toString() === currentWeek) opt.selected = true;
      weekSel.appendChild(opt);
    });

    renderData();
  }

  function onSeasonChange(yr) {
    currentYear = yr;
    populateWeeks(yr);
  }

  function onWeekChange(wk) {
    currentWeek = wk;
    renderData();
  }

  function renderData() {
    document.getElementById('headerTitle').innerText = `${currentYear} WEEK ${currentWeek} SUMMARY`;
    document.getElementById('tabBtnWeek').innerText = `📅 Week ${currentWeek} Summary`;

    const wkData = seasonsData[currentYear]?.[currentWeek] || [];
    const tbody = document.getElementById('weekTableBody');
    tbody.innerHTML = '';

    wkData.forEach((t, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="team-cell">#${idx + 1} ${t.team}</td>
        <td><span class="badge ${t.result === 'W' ? 'badge-win' : 'badge-loss'}">${t.result}</span></td>
        <td><b>${t.actual.toFixed(2)}</b></td>
        <td>${t.opp} (${t.opp_actual.toFixed(2)})</td>
        <td><b>${t.all_play_w}</b>–${t.all_play_l}</td>
        <td><b>${t.coach_eff.toFixed(1)}%</b></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    localStorage.setItem('ff_theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-toggle').innerHTML = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
  }

  if (localStorage.getItem('ff_theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('theme-toggle').innerHTML = '🌙 Dark Mode';
  }

  window.onload = init;
</script>
</body>
</html>
