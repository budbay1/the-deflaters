name: Run Fantasy Audit

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week Number to Audit'
        required: false
        default: ''
  schedule:
    - cron: '0 12 * * 2'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install espn-api

      - name: Run Audit
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          YEAR: '2025'
          WEEK: ${{ github.event.inputs.week }}
        run: |
          python audit.py

      - name: Commit and Push Generated Reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html global_dashboard_data.json seasons_data.json league_history_*.json
          git commit -m "Update league audit and global dashboard data [skip ci]" || echo "No changes to commit"
          git push
