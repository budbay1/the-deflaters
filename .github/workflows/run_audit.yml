name: Run Fantasy Audit

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week Number to Audit'
        required: true
        default: '1'
  schedule:
    # Optional backup: runs automatically every Tuesday at 7:00 AM Central Time (12:00 UTC)
    - cron: '0 12 * * 2'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install espn-api

      - name: Run Audit
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          YEAR: '2026'
          WEEK: ${{ github.event.inputs.week || '1' }}
        run: |
          python audit.py

      - name: Commit and Save History + Webpage
        run: |
          git config --global user.name "FantasyBot"
          git config --global user.email "bot@fantasy.internal"
          git add league_history_*.json index.html
          git commit -m "Updated Fantasy Audit for Week ${{ github.event.inputs.week || '1' }}" || echo "No changes to commit"
          git push
