name: Run Fantasy Audit

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week Number (leave blank for automatic latest completed week)'
        required: false
        default: ''
      year:
        description: 'Season Year (leave blank for current season)'
        required: false
        default: ''
  schedule:
    # Runs every Tuesday at 12:00 UTC (7:00 AM CDT / 8:00 AM EDT)
    - cron: '0 12 * * 2'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install espn-api

      - name: Run Audit
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          YEAR: ${{ github.event.inputs.year }}
          WEEK: ${{ github.event.inputs.week }}
        run: |
          python audit.py

      - name: Commit and Save History + Webpage
        run: |
          git config --global user.name "FantasyBot"
          git config --global user.email "bot@fantasy.internal"
          git add league_history_*.json seasons_data.json index.html
          git commit -m "Automated Multi-Season Audit Update" || echo "No changes to commit"
          git push
